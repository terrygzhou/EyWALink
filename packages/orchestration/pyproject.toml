[project]
name = "eywalink-orchestration"
version = "0.1.0"
description = "EyWALink agent orchestration core: LangGraph workflows, state, LLM client, config, persistence."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "langgraph>=1.0,<2.0",
    "langchain-openai>=1.0,<2.0",
    "pyyaml>=6.0,<7.0",
    "httpx>=0.27,<1.0",
    "mcp>=1.0,<2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.24,<1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eywalink_orchestration"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
