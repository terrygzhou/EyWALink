[project]
name = "eywalink-orchestration"
version = "0.1.0"
description = "EyWALink agent orchestration platform — LangGraph core (zero lock-in, budget-friendly private AI)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "EyWALink", email = "info@eywalink.org" }]
dependencies = [
    "langgraph>=1.0,<2",
    "langchain-openai>=0.3",
    "langchain-core>=0.3",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eywalink_orchestration"]

[tool.pytest.ini_options]
testpaths = ["tests"]
