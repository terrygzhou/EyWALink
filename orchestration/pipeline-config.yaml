# EyWALink pipeline configuration
# Single YAML file drives the whole orchestration pipeline.
pipeline:
  name: demo
  objective: "Build a zero-lock-in private AI demo service"

llm:
  base_url: "http://localhost:8080/v1"   # vLLM / SGLang OpenAI-compatible endpoint
  model: "Qwen3.6-35B-A3B"               # use the ID returned by /v1/models
  api_key: ""                            # local servers don't need one
  max_tokens: 32768                      # reasoning models need headroom
  temperature: 0.7
  read_timeout: 600                      # local models are slow — never 5s httpx default
  connect_timeout: 30
  max_retries: 2

state:
  file: pipeline-status.json             # persistence for session resume
  persist_artifacts: true

tools:
  mcp_servers:
    # stdio transport: spawn an MCP server as a subprocess
    # - name: filesystem
    #   transport: stdio
    #   command: npx
    #   args: ["-y", "@modelcontextprotocol/server-filesystem", "/tmp"]
    # http transport: talk JSON-RPC over HTTP
    # - name: remote
    #   transport: http
    #   url: "http://localhost:9100/mcp"
    #   headers: {}

gates:
  max_rework: 2                          # HIL gate can send back to architect at most N times
